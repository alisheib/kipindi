<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Needle</title>
<link rel="stylesheet" href="theme/globals.css">
<style>
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  /* Transform responsibilities are split so nothing ever fights:
     #needle = position · #tilt = inertia lean + impact squash · #disc = spin */
  /* Reads the real safe-area insets so the object never parks under a notch,
     a home indicator, or the iOS URL bar. */
  #safe { position: fixed; top: 0; left: 0; width: 0; height: 0; pointer-events: none; visibility: hidden;
          padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px);
          padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); }
  #needle { position: fixed; top: 0; left: 0; width: var(--nsize, 80px); height: var(--nsize, 80px); z-index: 900; pointer-events: none; }
  #tilt   { position: absolute; inset: 0; transform-style: preserve-3d; }
  #hit    { position: absolute; inset: 0; border-radius: 50%; pointer-events: auto; cursor: grab; touch-action: none; display: block; }
  /* The rim spins and the hub carries. Different jobs deserve different cursors. */
  #hub    { position: absolute; left: 33%; top: 33%; width: 34%; height: 34%; border-radius: 50%; pointer-events: auto; cursor: grab; touch-action: none; }
  #hit    { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><path d='M5 12a7 7 0 1 1 3 5.8' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round'/><path d='M4.4 8.2 5 12l3.8-.6' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round'/></svg>") 12 12, grab; }
  /* Tucked, the circle's tappable chord tapers to nothing toward the viewport
     interior. These pads cover the visible half edge-to-edge instead: a uniform
     ~42x80 target. Note the mirroring — parked on the RIGHT edge, it is the box's
     LEFT half that is actually on screen. */
  #hit.tuck-right  { inset: 0 auto 0 0; width: var(--npad, 44px); border-radius: 999px 0 0 999px; }
  #hit.tuck-left   { inset: 0 0 0 auto; width: var(--npad, 44px); border-radius: 0 999px 999px 0; }
  #hit.tuck-bottom { inset: 0 0 auto 0; height: var(--npad, 44px); border-radius: 999px 999px 0 0; }
  #hit.tuck-top    { inset: auto 0 0 0; height: var(--npad, 44px); border-radius: 0 0 999px 999px; }
  #hit:focus-visible { outline: 2px solid var(--brand-500); outline-offset: 5px; }
  #trail, #glow, #ring, #shadow, #wake { position: absolute; border-radius: 50%; pointer-events: none; }
  #shadow { inset: 4%; opacity: 0; box-shadow: 0 14px 30px -8px oklch(4% 0.04 268 / 0.85); transition: opacity 220ms linear; }
  #wake   { inset: var(--halo, -34%); opacity: 0; transition: opacity 320ms linear; }
  #wake.on { opacity: 1; animation: wake-breathe 3.6s cubic-bezier(0.65,0,0.35,1) infinite; }
  @keyframes wake-breathe {
    0%,100% { opacity: calc(var(--pmax, 1) * 0.42); transform: scale(0.94); }
    50%     { opacity: var(--pmax, 1);              transform: scale(1.06); }
  }
  #trail  { inset: -15%; opacity: 0; filter: blur(6px);
            background: conic-gradient(from 0deg, transparent 0deg, color-mix(in oklab, var(--gilt) 52%, transparent) 34deg, color-mix(in oklab, var(--gilt) 12%, transparent) 74deg, transparent 104deg, transparent 360deg); }
  #glow   { inset: calc(var(--halo, -34%) * 0.7); opacity: 0; transition: opacity 160ms linear;
            background: radial-gradient(circle, color-mix(in oklab, var(--gilt) 26%, transparent) 0%, color-mix(in oklab, var(--brand-400) 10%, transparent) 45%, transparent 68%); }
  #ring   { inset: -5%; opacity: 0; border: 1.5px solid color-mix(in oklab, var(--gilt) 78%, transparent); }
  /* The closed ring. The trail arc only completes into a full circle above 88% of
     max spin — the mark's "tipping point" motif momentarily resolved into a whole.
     Nothing is awarded and nothing is announced: it is a thing you find by spinning
     it as hard as you can, and the only reward is that you saw it. */
  #whole  { inset: -15%; opacity: 0; pointer-events: none; border-radius: 50%;
            background: conic-gradient(from 0deg, color-mix(in oklab, var(--gilt) 30%, transparent) 0deg, color-mix(in oklab, var(--gold-300) 46%, transparent) 120deg, color-mix(in oklab, var(--gilt) 30%, transparent) 240deg, color-mix(in oklab, var(--gold-300) 46%, transparent) 360deg);
            filter: blur(7px); transition: opacity 200ms linear; }
  @media (prefers-reduced-motion: reduce) { #whole { display: none; } }
  svg { display: block; overflow: visible; shape-rendering: geometricPrecision; }
  @media (prefers-reduced-motion: reduce) { #trail, #ring { display: none; } #wake.on { animation: none; opacity: 0.8; } }
</style>
</head>
<body>
<div id="safe" aria-hidden="true"></div>
<div id="needle" role="presentation">
  <div id="tilt">
    <span id="wake"></span>
    <span id="glow"></span>
    <span id="trail"></span>
    <span id="whole"></span>
    <span id="shadow"></span>
    <span id="ring"></span>
    <svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">
      <defs>
        <!-- ENAMEL livery (ship). The brand hues, but fired as deep cloisonné enamel
             instead of painted flat: jewel-dark so they sit inside the royal palette
             rather than fighting it. Bright emerald + brick red at full saturation
             read as a carnival prize wheel — the exact wrong signal for a
             responsible-play object — and they also stole the YES/NO semantics that
             belong to betting surfaces. Polished inlay arcs at the rim carry the
             brand recognition. Rationale in NEEDLE-SPEC §0.
             Hues preserved: green 152, rose 22. Only lightness and chroma move. -->
        <!-- SIGNAL livery (ship). Near-flat faces, because this object is 80px on
             screen and a 40px sliver when tucked: multi-stop gradients, gloss and
             vignette all collapse into mud at that size. Value contrast and an
             emissive needle are what actually read at a glance on a busy board.
             Hues preserved (152 / 22); see NEEDLE-SPEC 0. -->
        <linearGradient id="faceL" x1="0.2" y1="0" x2="0.8" y2="1">
          <stop offset="0%"   stop-color="#1C9264"></stop>
          <stop offset="100%" stop-color="#146F4C"></stop>
        </linearGradient>
        <linearGradient id="faceR" x1="0.2" y1="0" x2="0.8" y2="1">
          <stop offset="0%"   stop-color="#A83A43"></stop>
          <stop offset="100%" stop-color="#822A33"></stop>
        </linearGradient>
        <!-- Seating light. Depth comes from a fixed world-space light, never from
             repainting the faces. -->
        <linearGradient id="spec" x1="0.12" y1="0" x2="0.72" y2="1">
          <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.17"></stop>
          <stop offset="30%"  stop-color="#ffffff" stop-opacity="0.04"></stop>
          <stop offset="56%"  stop-color="#0A0E28" stop-opacity="0.12"></stop>
          <stop offset="100%" stop-color="#0A0E28" stop-opacity="0.42"></stop>
        </linearGradient>
        <radialGradient id="gloss" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.30"></stop>
          <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.10"></stop>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
        </radialGradient>
        <clipPath id="face"><circle cx="50" cy="50" r="46"></circle></clipPath>
        <radialGradient id="vig" cx="0.5" cy="0.5" r="0.5">
          <stop offset="62%"  stop-color="#0A0E28" stop-opacity="0"></stop>
          <stop offset="88%"  stop-color="#0A0E28" stop-opacity="0.16"></stop>
          <stop offset="100%" stop-color="#0A0E28" stop-opacity="0.40"></stop>
        </radialGradient>
        <linearGradient id="rim" x1="0.15" y1="0" x2="0.85" y2="1">
          <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.52"></stop>
          <stop offset="42%"  stop-color="#ffffff" stop-opacity="0.06"></stop>
          <stop offset="100%" stop-color="#E3BC66" stop-opacity="0.34"></stop>
        </linearGradient>
        <radialGradient id="hub" cx="0.34" cy="0.28" r="0.85">
          <stop offset="0%"   stop-color="#FFF3D4"></stop>
          <stop offset="42%"  stop-color="#EFCC7C"></stop>
          <stop offset="78%"  stop-color="#D8AE55"></stop>
          <stop offset="100%" stop-color="#A87D33"></stop>
        </radialGradient>
        <!-- at speed the two wedges average into a single ring, exactly as a real
             spinning colour wheel does. Vector, so it stays sharp at any DPI. -->
        <linearGradient id="blendA" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#146F4C"></stop>
          <stop offset="100%" stop-color="#822A33"></stop>
        </linearGradient>
        <filter id="cast" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="7" stdDeviation="6.5" flood-color="oklch(5% 0.05 268)" flood-opacity="0.58"></feDropShadow>
        </filter>
      </defs>

      <g filter="url(#cast)">
        <g id="disc" style="transform-origin: 50px 50px">
          <path d="M 38.87 5.37 A 46 46 0 0 0 61.13 94.63 Z" fill="url(#faceL)"></path>
          <path d="M 38.87 5.37 A 46 46 0 0 1 61.13 94.63 Z" fill="url(#faceR)"></path>
          <!-- polished inlay: a bright line of each brand hue at the rim, where enamel
               would meet the bezel on a real cloisonné piece -->
          <!-- luminous edge: the faces read as backlit panels, not painted metal -->
          <path d="M 38.87 5.37 A 46 46 0 0 0 61.13 94.63" fill="none" stroke="#54EDA6" stroke-width="var(--inlay, 2.6)" opacity="0.95"></path>
          <path d="M 38.87 5.37 A 46 46 0 0 1 61.13 94.63" fill="none" stroke="#FF7B82" stroke-width="var(--inlay, 2.6)" opacity="0.95"></path>
          <!-- dark underlay so the gold needle separates from both faces at any angle -->
          <line x1="38.39" y1="3.43" x2="61.61" y2="96.57" stroke="#070A1E" stroke-width="7.5" stroke-linecap="round" opacity="0.62"></line>
          <line x1="38.39" y1="3.43" x2="61.61" y2="96.57" stroke="#FFE7B0" stroke-width="var(--needlew, 4.4)" stroke-linecap="round"
                style="filter: drop-shadow(0 0 3px rgba(255,214,120,0.9))"></line>
        </g>
        <!-- colour averaging + needle smear: vector motion blur, no raster filter -->
        <circle id="blend" cx="50" cy="50" r="46" fill="url(#blendA)" opacity="0"></circle>
        <g id="smearA" style="transform-origin: 50px 50px" opacity="0">
          <line x1="38.39" y1="3.43" x2="61.61" y2="96.57" stroke="#F0D08A" stroke-width="3.6" stroke-linecap="round"></line>
        </g>
        <g id="smearB" style="transform-origin: 50px 50px" opacity="0">
          <line x1="38.39" y1="3.43" x2="61.61" y2="96.57" stroke="#F0D08A" stroke-width="3" stroke-linecap="round"></line>
        </g>
        <!-- fixed light + edge vignette: stay put while the body turns underneath -->
        <circle cx="50" cy="50" r="46" fill="url(#spec)"></circle>
        <circle cx="50" cy="50" r="46" fill="url(#vig)"></circle>
        <circle cx="50" cy="50" r="46.4" fill="none" stroke="#080B22" stroke-width="1.4" opacity="0.72"></circle>
        <circle cx="50" cy="50" r="47.3" fill="none" stroke="url(#rim)" stroke-width="1.5"></circle>
        <circle id="edgeArc" cx="50" cy="50" r="47.3" fill="none" stroke="var(--aqua-300)" stroke-width="1.9" opacity="0"
                style="filter: drop-shadow(0 0 5px color-mix(in oklab, var(--aqua-400) 70%, transparent))"></circle>
        <!-- pivot: the grab target, so it must read as a machined jewel, not a screw -->
        <circle cx="50" cy="50" r="10" fill="#0A0E28" opacity="0.34"></circle>
        <circle cx="50" cy="50" r="7.4" fill="#0A0E28" opacity="0.58"></circle>
        <circle cx="50" cy="50" r="6.3" fill="url(#hub)"></circle>
        <circle cx="50" cy="50" r="6.3" fill="none" stroke="#7C5A22" stroke-width="0.5" opacity="0.7"></circle>
        <circle cx="47.9" cy="47.6" r="1.7" fill="#FFF8E6" opacity="0.72"></circle>
        <circle cx="50" cy="50" r="1.5" fill="#141A38"></circle>
      </g>
    </svg>
    <span id="hit" role="button" tabindex="0" aria-label="Needle — an optional fidget toy. Nothing here affects your account. Space to spin, arrow keys to move, Escape to tuck it away."></span>
  </div>
</div>

<script type="module">
import { NeedleBody } from "./needle-physics.js";
import { haptic, hapticImpact, hapticDetent } from "./needle-haptics.js";

const el = document.getElementById("needle");
const tilt = document.getElementById("tilt");
const hit = document.getElementById("hit");
const disc = document.getElementById("disc");
const trail = document.getElementById("trail");
const whole = document.getElementById("whole");
const glow = document.getElementById("glow");
const ring = document.getElementById("ring");
const shadow = document.getElementById("shadow");
const wake = document.getElementById("wake");
const edgeArc = document.getElementById("edgeArc");
const blend = document.getElementById("blend");
const smearA = document.getElementById("smearA");
const smearB = document.getElementById("smearB");

function clampN(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

const mq = matchMedia("(prefers-reduced-motion: reduce)");
let raf = null, last = 0, pid = null, samples = [], down = null, wasParked = false, pending = null;
let blurStep = -1, trailOpa = -1, tiltStr = "", squash = 1, squashV = 0, shadowOn = -1, wakeOn = -1, blendOpa = -1;
let hoverOut = 0, hoverTo = 0, presenceOn = -1, wholeOpa = -1;
/* Keep-out zones, read lazily and cached per frame.

   Two traps this avoids. (1) A docked bet slip mounts on INTERACTION, not at boot, so
   any cached "do any exist" flag is stale exactly when the feature is needed — the
   selector is therefore matched fresh every time. (2) The read must not live in the
   rAF tick: that loop sleeps when the object is at rest, so obstacles mounted while it
   sleeps would never register. Instead the engine's own obstacles() callback triggers
   the read, and a frame stamp collapses the up-to-72 collision queries in a single
   frame down to one layout read. */
let keepOuts = [], keepOutAt = -1;
function readKeepOuts() {
  // Self-invalidating on TIME, not on a host-driven frame counter: a counter only
  // advances while the rAF loop is alive, and the loop sleeps at rest — so an
  // obstacle mounted during sleep would never be seen. 8ms collapses the up-to-72
  // collision queries in one frame into a single layout read.
  const now = performance.now();
  if (now - keepOutAt < 8) return keepOuts;
  keepOutAt = now;
  const els = document.querySelectorAll("[data-needle-keepout]");
  if (!els.length) { keepOuts = keepOuts.length ? [] : keepOuts; return keepOuts; }
  const next = [];
  for (const n of els) {
    const r = n.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) next.push({ x: r.left, y: r.top, w: r.width, h: r.height });
  }
  keepOuts = next;
  return keepOuts;
}
const safe = document.getElementById("safe");

/** Real safe-area insets, read from CSS env() via a hidden probe. */
function insets() {
  const s = getComputedStyle(safe);
  return {
    top: parseFloat(s.paddingTop) || 0,
    right: parseFloat(s.paddingRight) || 0,
    bottom: parseFloat(s.paddingBottom) || 0,
    left: parseFloat(s.paddingLeft) || 0,
  };
}

/** visualViewport is the honest viewport on mobile: it excludes the URL bar and
    shrinks when the on-screen keyboard opens. innerHeight lies about both. */
function viewport() {
  const vv = window.visualViewport;
  return { w: Math.round(vv ? vv.width : innerWidth), h: Math.round(vv ? vv.height : innerHeight) };
}

/** Diameter, sized for restraint rather than for presence.

    A phone screen is 360–430px wide and mostly belongs to the player's content. At
    0.19 of the narrow side the disc came out 68px — larger than a platform FAB (56px)
    and, with its halo, occupying 32% of the screen width. That is not a discreet
    object, it is an obstruction.

    0.155 puts it at 56px on a 360px phone (exactly FAB scale, a size people already
    accept as "a small floating control"), 60px on a 390, 88px on tablet and desktop
    where there is room to be generous. */
function diameter() {
  const v = viewport();
  return Math.round(clampN(Math.min(v.w, v.h) * 0.155, 56, 88));
}

/** Halo reach, as a fraction of the disc. The halo — not the disc — is the largest
    visual footprint, so it is what has to give on a small screen: -14% on a phone
    against -34% on a desktop, which keeps the total tucked footprint under 16% of
    the narrow viewport dimension at every size. */
function haloInset() {
  const v = viewport();
  const t = clampN((Math.min(v.w, v.h) - 360) / (900 - 360), 0, 1);
  return -(14 + t * 20).toFixed(1);
}

const body = new NeedleBody({
  size: diameter(),
  bounds: () => { const v = viewport(); return { w: v.w, h: v.h, insets: insets() }; },
  /* Interior keep-out zones. Any element carrying data-needle-keepout is collided
     with, so the object deflects off a docked bet slip or a bottom nav instead of
     passing through it. Read live so it follows layout without the engine touching
     the DOM. Cached per frame by the caller below. */
  obstacles: readKeepOuts,
  onImpact: (i) => {
    hapticImpact(i.speed);
    // impact is felt as a compression along the contact normal, not a bounce of the art
    squashV -= Math.min(0.09, i.speed * 0.05);
    if (mq.matches) return;
    ring.style.transition = "none";
    ring.style.opacity = String(Math.min(0.55, i.speed * 0.55));
    ring.style.transform = `translate(${-i.nx * 7}px, ${-i.ny * 7}px) scale(1)`;
    requestAnimationFrame(() => {
      ring.style.transition = "opacity 280ms linear, transform 280ms cubic-bezier(0.32,0.72,0,1)";
      ring.style.opacity = "0";
      ring.style.transform = "translate(0,0) scale(1.26)";
    });
  },
  onCross: () => haptic("cross"),
  onPark: (edge) => { haptic("tuck"); save(); },
  onSleep: () => { el.style.willChange = "auto"; haptic("settled"); save(); },
  onTrue: () => haptic("trueFound"),
  onDetent: (strength, quarters) => hapticDetent(strength, quarters),
  onCatch: (info) => {
    haptic("catch");
    // Catching it compresses the body: you absorbed real momentum.
    squashV -= Math.min(0.12, info.w * 0.06);
    start();
  },
  /* Analytics: one event per completed interaction, never per frame. This is what
     answers "does anyone actually use this" in a roadmap review. */
  onInteraction: (d) => { try { window.dispatchEvent(new CustomEvent("needle:interaction", { detail: d })); } catch (e) {} },
});
body.calm = mq.matches ? 0.34 : 1;
mq.addEventListener("change", () => { body.calm = mq.matches ? 0.34 : 1; });

let saved = null;
try { saved = JSON.parse(localStorage.getItem("50pick.needle.pos") || "null"); } catch (e) {}
body.y = saved && Number.isFinite(saved.y) ? saved.y : viewport().h * 0.5 - body.radius;
body.snapPark(saved && saved.edge ? saved.edge : "right");
paint(0);

function save() {
  try { localStorage.setItem("50pick.needle.pos", JSON.stringify({ x: Math.round(body.x), y: Math.round(body.y), edge: body.edge })); } catch (e) {}
}

function paint(dt) {
  // hover peek: the tucked sliver leans out to say it is grabbable
  if (dt) {
    const f = clampN(dt / 16.67, 0, 3);
    hoverOut += (hoverTo - hoverOut) * 0.22 * f;
    if (Math.abs(hoverTo - hoverOut) < 0.05) hoverOut = hoverTo;
  }
  const nx = body.edge === "right" ? -1 : body.edge === "left" ? 1 : 0;
  const ny = body.edge === "bottom" ? -1 : body.edge === "top" ? 1 : 0;
  const ox = body.parked ? nx * hoverOut : 0;
  const oy = body.parked ? ny * hoverOut : 0;
  el.style.transform = `translate3d(${(body.x + ox).toFixed(2)}px, ${(body.y + oy).toFixed(2)}px, 0)`;
  disc.style.transform = `rotate(${body.a.toFixed(2)}deg)`;

  // Vector motion smear. Two ghost needles lag behind the real one by an angle
  // proportional to speed, and the wedges average into one ring — which is what a
  // spinning disc genuinely looks like. No raster blur, so it stays sharp at any DPI.
  const sp = Math.abs(body.w);
  const dir = body.w < 0 ? 1 : -1;
  const lag = Math.min(46, sp * 26);
  const gA = Math.min(0.5, sp * 0.42);
  const gB = Math.min(0.28, sp * 0.24);
  if (Math.abs(gA - blurStep) > 0.015) {
    smearA.setAttribute("opacity", gA.toFixed(3));
    smearB.setAttribute("opacity", gB.toFixed(3));
    blurStep = gA;
  }
  if (gA > 0.004) {
    smearA.style.transform = `rotate(${(body.a + dir * lag * 0.5).toFixed(2)}deg)`;
    smearB.style.transform = `rotate(${(body.a + dir * lag).toFixed(2)}deg)`;
  }
  const bo = Math.min(0.9, Math.max(0, (sp - 0.55) * 0.85));
  if (Math.abs(bo - blendOpa) > 0.015) { blend.setAttribute("opacity", bo.toFixed(3)); blendOpa = bo; }

  // trail leads the spin and flips with its direction
  const o = mq.matches ? 0 : Math.min(0.66, sp / 2.2);
  if (Math.abs(o - trailOpa) > 0.02) { trail.style.opacity = o.toFixed(2); trailOpa = o; }
  if (o > 0.01) trail.style.transform = `rotate(${(body.a * (body.w < 0 ? -1 : 1) * 0.35 + (body.w < 0 ? 180 : 0)).toFixed(1)}deg)`;
  // closed ring: the arc becomes whole only in the top 12% of spin speed
  const wo = mq.matches ? 0 : Math.max(0, (sp / 2.8 - 0.88) / 0.12) * 0.85;
  if (Math.abs(wo - wholeOpa) > 0.02) { whole.style.opacity = wo.toFixed(2); wholeOpa = wo; }

  // inertia lean: the disc tips into its own acceleration, then recovers.
  // The squash spring integrates ONLY on real frames (dt passed), so a pointermove
  // landing inside the same frame can never double-step it.
  const lean = mq.matches ? 0 : 1;
  const rx = clampN(-body.vy * 2.6, -7, 7) * lean;
  const ry = clampN(body.vx * 2.6, -7, 7) * lean;
  if (dt) {
    const f = clampN(dt / 16.67, 0, 3);
    squashV += (1 - squash) * 0.055 * f;
    squashV *= Math.pow(0.86, f);
    squash += squashV * f;
  }
  const t = `perspective(420px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) scale(${squash.toFixed(4)})`;
  if (t !== tiltStr) { tilt.style.transform = t; tiltStr = t; }

  const tucked = body.parked ? 1 : 0;
  if (tucked !== shadowOn) { shadow.style.opacity = tucked ? "0.9" : "0"; shadowOn = tucked; }
  // tucked: a slow aqua breath so it is unmissable without asking for attention.
  // Keyed on edge as well as state — re-parking on a different edge must move the
  // pad and the halo with it.
  const wantWake = body.parked && !body.held ? body.edge : "";
  if (wantWake !== wakeOn) {
    wake.classList.toggle("on", !!wantWake);
    edgeArc.setAttribute("opacity", wantWake ? "0.85" : "0");
    // swap the circular hit area for a full-height pad over the visible half
    hit.className = wantWake ? "tuck-" + wantWake : "";
    if (wantWake) hit.style.setProperty("--npad", body.padPx() + "px");
    // bias the halo toward the visible half so it still reads when tucked
    const at = body.edge === "right" ? "28% 50%" : body.edge === "left" ? "72% 50%"
             : body.edge === "top" ? "50% 72%" : "50% 28%";
    wake.style.background = wantWake
      ? `radial-gradient(circle at ${at}, color-mix(in oklab, var(--aqua-400) 46%, transparent) 0%, color-mix(in oklab, var(--aqua-500) 20%, transparent) 38%, transparent 64%)`
      : "none";
    wakeOn = wantWake;
  }
  // Presence: halo strength and breath rate track session length. At 0 it is a
  // whisper you could ignore; at an hour it is clearly, calmly there.
  if (body.presence !== presenceOn) {
    const pr = body.presence;
    wake.style.setProperty("--pmax", (0.42 + pr * 0.58).toFixed(3));
    wake.style.animationDuration = (4.6 - pr * 1.4).toFixed(2) + "s";
    if (body.parked) hit.style.setProperty("--npad", body.padPx() + "px");
    presenceOn = pr;
  }}


function start() {
  if (raf) return;
  last = performance.now();
  el.style.willChange = "transform";
  const tick = (t) => {
    let dt = t - last; last = t;
    if (dt > 50) dt = 50;               // never integrate a tab-switch gap
    if (body.held) applyDrag();         // consume pointer input on the frame, not per event
    body.advance(dt);
    paint(dt);
    raf = (body.awake || Math.abs(1 - squash) > 0.0015 || hoverOut !== hoverTo) ? requestAnimationFrame(tick) : null;
    if (!raf) { squash = 1; squashV = 0; paint(0); }
  };
  raf = requestAnimationFrame(tick);
}
function stop() { if (raf) { cancelAnimationFrame(raf); raf = null; } }

hit.addEventListener("pointerdown", (e) => {
  if (e.button) return;
  if (pid !== null) return;
  pid = e.pointerId;
  wasParked = body.parked || body.parking;
  down = { x: e.clientX, y: e.clientY, t: performance.now() };
  body.hold(wasParked ? "move" : body.grabKind(e.clientX, e.clientY));
  samples = [{ x: e.clientX, y: e.clientY, a: Math.atan2(e.clientY - body.cy, e.clientX - body.cx) * 180 / Math.PI, t: performance.now() }];
  hit.style.cursor = "grabbing";
  glow.style.opacity = "1";
  haptic("grab");
  if (hit.setPointerCapture) hit.setPointerCapture(e.pointerId);
  e.preventDefault();
  start();
});

addEventListener("pointermove", (e) => {
  if (!body.held || (pid !== null && e.pointerId !== pid)) return;
  e.preventDefault();
  // Only record; the frame loop applies it. Coalesced events on a 240Hz mouse
  // therefore cost nothing and can never paint twice in one frame.
  pending = { x: e.clientX, y: e.clientY };
}, { passive: false });

function applyDrag() {
  if (!pending) return;
  const l = samples[samples.length - 1];
  if (body.held === "move") {
    body.dragBy(pending.x - l.x, pending.y - l.y);
    samples.push({ x: pending.x, y: pending.y, a: l.a, t: performance.now() });
  } else {
    const a = body.turnTo(pending.x, pending.y, l.a);
    samples.push({ x: pending.x, y: pending.y, a, t: performance.now() });
  }
  if (samples.length > 8) samples.shift();
  pending = null;
}

function release(e) {
  if (!body.held || (pid !== null && e && e.pointerId != null && e.pointerId !== pid)) return;
  applyDrag();
  const wasKind = body.held;
  pid = null;
  pending = null;
  hit.style.cursor = "grab";
  glow.style.opacity = "0";
  const moved = down && e && e.clientX != null ? Math.hypot(e.clientX - down.x, e.clientY - down.y) : 0;
  const quick = down ? performance.now() - down.t < 320 : false;
  if (wasParked && quick && moved < 8) { haptic("wake"); body.wake(true); start(); return; }
  body.release(samples, body.held);
  start();
}
addEventListener("pointerup", release);
addEventListener("pointercancel", release);
addEventListener("blur", () => release());

hit.addEventListener("keydown", (e) => {
  const step = e.shiftKey ? 48 : 12;
  if (e.key === "Escape") { e.preventDefault(); body.held = null; body.parkTo(body.nearestEdge()); start(); return; }
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    if (body.parked || body.parking) body.wake(); else body.flick(1.7);
    start();
    return;
  }
  const map = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  if (map[e.key]) { e.preventDefault(); body.unpark(); body.dragBy(map[e.key][0], map[e.key][1]); start(); }
});

hit.addEventListener("pointerenter", (e) => {
  if (e.pointerType === "touch" || !body.parked) return;
  hoverTo = 7; start();
});
hit.addEventListener("pointerleave", () => { hoverTo = 0; start(); });

function applyViewport() {
  const d = diameter();
  if (d !== body.size) body.setSize(d);
  el.style.setProperty("--nsize", d + "px");
  /* Strokes are authored in a 100-unit viewBox, so they shrink with the element.
     At 64px a 2.6-unit inlay lands at 1.66 CSS px — sub-pixel on a 1x display,
     where it greys out into the face. Scale it back up so the brand hairlines
     stay a crisp ~1.9px at every diameter. */
  el.style.setProperty("--inlay", (2.6 * (88 / d)).toFixed(2));
  el.style.setProperty("--halo", haloInset() + "%");
  el.style.setProperty("--needlew", (4.4 * Math.max(1, 74 / d)).toFixed(2));
  body.reclamp();
  paint(0);
}
applyViewport();

addEventListener("resize", applyViewport);
addEventListener("orientationchange", () => setTimeout(applyViewport, 120));
if (window.visualViewport) {
  visualViewport.addEventListener("resize", applyViewport);
  visualViewport.addEventListener("scroll", applyViewport);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stop();
  else if (body.awake) { body.acc = 0; start(); }
});

/* Platform API. Mount once in the shell; these are the only two calls a page makes. */
window.needle = {
  session: (minutes) => { if (body.setSession(minutes)) { paint(0); start(); } },
  acknowledge: () => { if (body.acknowledge()) start(); },
};
window.__needle = body;
</script>
</body>
</html>
