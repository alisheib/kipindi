<!DOCTYPE html><html><head><meta charset="utf-8"><title>50pick — Skeletons</title>
<link rel="stylesheet" href="../../01-foundations/tokens.css">
<style>
body{background:var(--bg);color:var(--text);font-family:var(--font-body);padding:40px;margin:0}
h1{font-family:var(--font-display);font-size:22px;margin:0 0 6px}
.note{color:var(--text-muted);font-size:12.5px;max-width:680px;line-height:1.6;margin:0 0 28px}
h2{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-subtle);margin:34px 0 12px;font-weight:600}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.cap{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);margin-top:6px}
a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
</style></head><body><h1>Skeletons</h1><p class="note">GIVEN base class; loading layouts always mirror the real component anatomy (same radii/heights) so content lands without reflow.</p><h2>Blocks</h2><div style="max-width:340px;display:flex;flex-direction:column;gap:10px"><div class="skeleton" style="width:70%;height:13px"></div><div class="skeleton" style="width:100%;height:52px;border-radius:var(--r-md)"></div><div class="skeleton" style="width:40px;height:40px;border-radius:50%"></div></div><h2>Card skeleton (D2 board recipe — INVENTED 2026-07)</h2><div style="width:320px;border:1px solid var(--border);background:var(--bg-elevated);border-radius:var(--r-lg);padding:14px"><div style="display:flex;gap:10px;margin-bottom:14px"><div class="skeleton" style="width:40px;height:40px;border-radius:50%;flex-shrink:0"></div><div style="flex:1"><div class="skeleton" style="width:70%;height:13px;margin-bottom:7px"></div><div class="skeleton" style="width:40%;height:9px"></div></div></div><div class="skeleton" style="width:100%;height:52px;border-radius:var(--r-md);margin-bottom:14px"></div><div style="display:flex;gap:8px"><div class="skeleton" style="flex:1;height:46px;border-radius:var(--r-md)"></div><div class="skeleton" style="flex:1;height:46px;border-radius:var(--r-md)"></div></div></div></body></html>
