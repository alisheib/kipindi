<!DOCTYPE html><html><head><meta charset="utf-8"><title>50pick — Tabs</title>
<link rel="stylesheet" href="../../01-foundations/tokens.css">
<style>
body{background:var(--bg);color:var(--text);font-family:var(--font-body);padding:40px;margin:0}
h1{font-family:var(--font-display);font-size:22px;margin:0 0 6px}
.note{color:var(--text-muted);font-size:12.5px;max-width:680px;line-height:1.6;margin:0 0 28px}
h2{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-subtle);margin:34px 0 12px;font-weight:600}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.cap{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);margin-top:6px}
a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
</style></head><body><h1>Tabs</h1><p class="note">INVENTED (2026-06/07, Positions + Up & Down), composed from kit tokens. Active = brand-blue ring (kit nav-active idiom) — cyan stays reserved for links/bottom-nav, gold for money.</p><h2>Primary tabs (asset / filter)</h2><div class="row"><button style="display:inline-flex;height:36px;align-items:center;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--brand-500);background:oklch(40% 0.12 262 / 0.35);color:var(--text);font-family:var(--font-body);font-size:13.5px;font-weight:600;box-shadow:0 0 10px oklch(63% 0.18 262 / 0.15)">Gold</button><button style="display:inline-flex;height:36px;align-items:center;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--border);background:color-mix(in oklab,var(--bg-elevated) 60%,transparent);color:var(--text-muted);font-family:var(--font-body);font-size:13.5px;font-weight:600">Silver</button></div><h2>Secondary tabs (duration — deliberately quieter)</h2><div class="row"><button style="display:inline-flex;height:28px;align-items:center;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--bg-inset);color:var(--text);font-family:var(--font-mono);font-size:11.5px;font-weight:600">5 min</button><button style="display:inline-flex;height:28px;align-items:center;padding:0 12px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--text-subtle);font-family:var(--font-mono);font-size:11.5px;font-weight:600">15 min</button><button style="display:inline-flex;height:28px;align-items:center;padding:0 12px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--text-subtle);font-family:var(--font-mono);font-size:11.5px;font-weight:600">30 min</button></div><h2>Count tabs (Positions filter)</h2><div class="row"><button style="display:inline-flex;height:32px;align-items:center;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--brand-500);background:oklch(40% 0.12 262 / 0.35);color:var(--text);font-family:var(--font-mono);font-size:12px;font-weight:600">All <span style="margin-left:6px;font-size:10px;opacity:0.6">9</span></button><button style="display:inline-flex;height:32px;align-items:center;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--border);background:color-mix(in oklab,var(--bg-elevated) 60%,transparent);color:var(--text-muted);font-family:var(--font-mono);font-size:12px;font-weight:600">Open <span style="margin-left:6px;font-size:10px;opacity:0.6">3</span></button></div></body></html>
