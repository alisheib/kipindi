<!DOCTYPE html><html><head><meta charset="utf-8"><title>50pick — Live indicators</title>
<link rel="stylesheet" href="../../01-foundations/tokens.css">
<style>
body{background:var(--bg);color:var(--text);font-family:var(--font-body);padding:40px;margin:0}
h1{font-family:var(--font-display);font-size:22px;margin:0 0 6px}
.note{color:var(--text-muted);font-size:12.5px;max-width:680px;line-height:1.6;margin:0 0 28px}
h2{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-subtle);margin:34px 0 12px;font-weight:600}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.cap{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);margin-top:6px}
a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
</style></head><body><h1>Live indicators</h1><p class="note">LiveDot is GIVEN (red --live-400, brightness-breathe pulse). The aqua pip is part of the ≤8% aqua finishing pass; aqua is never semantic.</p><h2>LiveDot</h2><div class="row"><span class="live-dot"></span><span class="chip chip-live"><span class="live-dot" style="width:6px;height:6px"></span>Live</span></div><h2>Streaming pip (price tape — INVENTED 2026-07)</h2><div class="row"><span style="display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-faint)"><span class="live-dot"></span> Streaming</span></div><h2>Aqua finishing pip (Positions strip — INVENTED 2026-06)</h2><div class="row"><span style="display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-subtle)"><span style="width:6px;height:6px;border-radius:50%;background:var(--aqua-300);box-shadow:0 0 8px var(--aqua-glow)"></span>Live</span></div></body></html>
