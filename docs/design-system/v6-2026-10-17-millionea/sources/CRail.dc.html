<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../motion/tokens/globals-extract.css">
<link rel="stylesheet" href="../motion/tokens/state-tokens.css">
<link rel="stylesheet" href="../motion/tokens/motion.css">
<script src="maswali-data.js"></script>
</helmet>
<div style="position:relative;height:68px;flex-shrink:0;display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding-top:var(--sp-2);background:var(--panel);border-top:1px solid var(--border)">
  <sc-for list="{{tracks}}" as="n" hint-placeholder-count="5">
    <div style="display:flex;flex-direction:column;align-items:center;gap:var(--sp-1);min-height:44px;color:{{n.ink}}">
      <sc-if value="{{n.coin}}" hint-placeholder-val="{{false}}">
        <span style="position:relative;width:var(--h-control-xl);height:var(--h-control-xl);margin-top:calc(-1 * var(--sp-6));border-radius:50%;background:var(--gilt-metal);box-shadow:var(--gilt-metal-edge),var(--shadow-3);display:flex;align-items:center;justify-content:center;color:var(--gold-fg)">
          <span style="position:absolute;inset:calc(-1 * var(--sp-1) + 1px);border-radius:50%;background:conic-gradient(from var(--m-tilt),var(--yes-500) 0 50%,var(--no-500) 50% 100%);z-index:-1"></span>
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg>
        </span>
      </sc-if>
      <sc-if value="{{n.plain}}" hint-placeholder-val="{{true}}">
        <span style="position:relative;width:44px;height:28px;border-radius:var(--r-pill);background:{{n.plate}};display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path><path d="{{n.d2}}"></path><path d="{{n.d3}}"></path></svg>
          <sc-if value="{{n.dot}}" hint-placeholder-val="{{false}}"><span style="position:absolute;top:0;right:4px;width:7px;height:7px;border-radius:50%;background:var(--gilt)"></span></sc-if>
        </span>
      </sc-if>
      <span style="font-family:var(--font-mono);font-size:11px;line-height:15px;letter-spacing:0.2px;font-weight:{{n.weight}};white-space:nowrap;color:{{n.labelInk}}">{{n.label}}</span>
    </div>
  </sc-for>
  <sc-if value="{{chat}}" hint-placeholder-val="{{true}}">
    <span style="position:absolute;right:var(--sp-4);bottom:80px;width:44px;height:44px;border-radius:50%;background:var(--bg-royal-soft);border:1px solid var(--border-royal);box-shadow:var(--elev-float);display:flex;align-items:center;justify-content:center;color:var(--text)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14v10H9l-4 4z"></path><path d="M8.5 10h7M8.5 7.5h4"></path></svg></span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:68},&quot;loc&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;sw&quot;,&quot;options&quot;:[&quot;sw&quot;,&quot;en&quot;,&quot;zh&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;markets&quot;,&quot;options&quot;:[&quot;markets&quot;,&quot;updown&quot;,&quot;live&quot;,&quot;more&quot;,&quot;positions&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;chat&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const M = window.MASWALI; const loc = this.props.loc || 'sw'; const t=(k)=>M?M.t(loc,k):k; const active = this.props.active || 'markets';
    const L = loc==='sw' ? ['Masoko','Juu/Chini','Amana','Mubashara','Zaidi'] : loc==='zh' ? ['市场','涨跌','存款','直播','更多'] : ['Markets','Up & Down','Deposit','Live','More'];
    const defs = [
      { id:'markets', d:'M12 4v16', d2:'M6 7h12', d3:'M6 7l-2.5 6a2.5 2.5 0 0 0 5 0zM18 7l-2.5 6a2.5 2.5 0 0 0 5 0zM8.5 20h7' },
      { id:'updown', d:'M3 17l6-6 4 4 8-8', d2:'M21 7v5M21 7h-5', dot:true },
      { id:'coin', coin:true },
      { id:'live', d:'M13 3L5 13h6l-1 8 8-10h-6z' },
      { id:'more', d:'M4 7h16M4 12h16M4 17h16' }
    ];
    const tracks = defs.map((d,i)=>Object.assign({ plain: !d.coin }, d, { label:L[i], ink: d.id===active?'var(--text)':'var(--text-subtle)', labelInk: d.coin?'var(--gilt)':(d.id===active?'var(--text)':'var(--text-subtle)'), plate: d.id===active?'var(--pill-active)':'transparent', weight: d.id===active||d.coin?700:500 }));
    return { tracks, chat: this.props.chat !== false };
  }
}
</script>
</body>
</html>
