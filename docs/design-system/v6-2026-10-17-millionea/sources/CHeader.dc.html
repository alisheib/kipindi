<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../motion/tokens/globals-extract.css">
<link rel="stylesheet" href="../motion/tokens/state-tokens.css">
<link rel="stylesheet" href="../motion/tokens/motion.css">
<script src="maswali-data.js"></script>
</helmet>
<div style="flex-shrink:0;display:flex;flex-direction:column;background:var(--panel)">
  <div style="height:56px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-4)">
    <img src="assets/mark-color.svg" width="28" height="28" alt="50pick" style="flex-shrink:0">
    <sc-if value="{{wide}}" hint-placeholder-val="{{false}}">
      <span style="font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-0.55px;color:var(--text)">50pick</span>
      <nav style="display:flex;align-items:center;gap:var(--sp-5);margin-left:var(--sp-6)">
        <sc-for list="{{nav}}" as="n" hint-placeholder-count="6"><span style="font-family:var(--font-body);font-weight:600;font-size:13px;color:{{n.ink}}">{{n.label}}</span></sc-for>
        <span style="display:flex;align-items:center;gap:4px;font-family:var(--font-body);font-weight:600;font-size:13px;color:var(--text-muted)">{{moreLabel}}<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
      </nav>
    </sc-if>
    <div style="flex:1"></div>
    <span style="height:40px;display:flex;align-items:center;padding:0 var(--sp-3);border:1px solid var(--border-strong);border-radius:var(--r-md);font-family:var(--font-mono);font-weight:700;font-size:12px;color:var(--text)">{{locUpper}}</span>
    <span style="height:40px;display:flex;align-items:center;gap:6px;padding:0 var(--sp-3);border:1px solid var(--border-strong);border-radius:var(--r-md);font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--text);font-variant-numeric:tabular-nums">{{balanceBare}}<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--text-subtle)"><path d="M6 9l6 6 6-6"></path></svg><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--text-muted)"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></span>
    <span style="position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--text-muted)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10a5 5 0 0 1 10 0c0 4 1.5 5 2 6H5c.5-1 2-2 2-6z"></path><path d="M10.5 20a1.7 1.7 0 0 0 3 0"></path></svg><span style="position:absolute;top:0;right:0;min-width:18px;height:18px;padding:0 4px;border-radius:var(--r-pill);background:var(--danger-500);color:var(--pearl-50);font-family:var(--font-mono);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">25</span></span>
    <span style="width:40px;height:40px;border-radius:50%;border:1px solid var(--border-royal);background:var(--bg-royal-soft);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--text)">DP</span>
  </div>
  <sc-if value="{{ticker}}" hint-placeholder-val="{{true}}">
    <div style="height:32px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-4);background:var(--bg-overlay);border-top:1px solid var(--border);border-bottom:1px solid var(--border);min-width:0;max-width:100%;overflow:hidden">
      <span style="width:6px;height:6px;border-radius:50%;background:var(--live-400);flex-shrink:0"></span>
      <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--live-400);flex-shrink:0">{{liveLabel}}</span>
      <span style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0">{{tickerText}}</span>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--text-subtle);flex-shrink:0"><rect x="7" y="5" width="3" height="14" rx="1"></rect><rect x="14" y="5" width="3" height="14" rx="1"></rect></svg>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:88},&quot;bp&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:360,&quot;options&quot;:[360,768,1280],&quot;tsType&quot;:&quot;number&quot;},&quot;loc&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;sw&quot;,&quot;options&quot;:[&quot;sw&quot;,&quot;en&quot;,&quot;zh&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;ticker&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const M = window.MASWALI; const loc = this.props.loc || 'sw'; const t=(k)=>M?M.t(loc,k):k;
    const wide = Number(this.props.bp||360) >= 1024;
    const labels = loc==='sw' ? ['Masoko','Juu/Chini','Mubashara','Matokeo','Nafasi','Pochi'] : loc==='zh' ? ['市场','涨跌','直播','结果','持仓','钱包'] : ['Markets','Up & Down','Live','Results','Positions','Wallet'];
    const nav = labels.map((l,i)=>({ label:l, ink: i===0?'var(--text)':'var(--text-muted)' }));
    return { wide, nav, moreLabel: t('classicMore'), locUpper: loc.toUpperCase(), balanceBare: M ? M.fmtN(44196) : '44,196', ticker: this.props.ticker !== false,
      liveLabel: t('classicLive'), tickerText: loc==='sw' ? 'Je, Zanzibar itakuwa na siku kamili ya jua Ijumaa hii? · NDIO 67%' : loc==='zh' ? '桑给巴尔本周五会是晴天吗？· 是 67%' : 'Will Zanzibar have a full sunny day this Friday? · YES 67%' };
  }
}
</script>
</body>
</html>
