name: CI

# Audit H9 — there was no CI. Every push to main is ALSO a live Railway deploy,
# so this runs in parallel as the safety net: types, the content-integrity guard,
# the full in-memory suite, the production build, and — the part a single laptop
# can't prove — the cross-instance money + audit-chain proofs against a REAL
# Postgres service (C4 double-spend, C6 audit-chain fork). PRs get the same gate
# before merge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: kipindi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Non-secret CI values. AUDIT_CHAIN_SECRET must be distinct from SESSION_SECRET
      # (chainSecret() enforces that in production-mode paths).
      SESSION_SECRET: ci-session-secret-0000000000000000
      AUDIT_CHAIN_SECRET: ci-audit-chain-secret-1111111111
      CI_DB_URL: postgresql://postgres:pw@localhost:5432/kipindi_ci?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          # Immutable classic render goldens use reviewed ancestors, not the current HEAD.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci runs `postinstall: prisma generate`, so the client is ready.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Content integrity
        run: npm run test:integrity

      # db-scratch suites own a separate, marked cluster on 5433. Keep their optional
      # binary runtime outside the locked application install and Railway builds.
      - name: Install scratch database test runtime
        run: |
          npm install --prefix /tmp/50pick-ci-scratch --no-audit --no-fund embedded-postgres@18.3.0-beta.17
          ln -s /tmp/50pick-ci-scratch/node_modules/embedded-postgres node_modules/embedded-postgres

      # In-memory suite (no DATABASE_URL).
      #
      # Five suites drive a running local browser/server. Run them serially below against
      # the same isolated in-memory dev process; the other suites keep their normal pool.
      #
      # ⛔ THE MATCH IS EXACT (scripts/test-all.mjs). It must NOT catch test:motion-ladder,
      # test:glyph-motion or test:reduce-motion — three serverless gates a substring skip
      # would have silently disabled while still printing a clean pass.
      # ⚠️ `--no-tsc`, and `integrity` in the skip list, because BOTH already ran as their
      # own steps above and the aggregator runs them again by default. That was a whole
      # extra typecheck of this tree on every push and every PR, buying nothing: a second
      # identical run of a deterministic check over the same commit cannot tell you
      # anything the first did not. The steps are kept separate (rather than dropped in
      # favour of the aggregator) because they are the fast-fail pair — a tree that does
      # not compile should not wait for 457 suites to say so.
      # The section-ownership controls use real about:blank DOMs without an app server.
      # Install Chromium before the battery so that serverless browser proof also runs in CI.
      - name: Install Chromium for browser gates
        run: npx playwright install --with-deps chromium

      - name: Section ownership DOM controls
        run: npm run qa:empty-state-alignment

      - name: Test suite (in-memory)
        run: node scripts/test-all.mjs --no-tsc --skip responsive,motion,revoked-deadend,admin-section-gate,needle-rest,integrity

      - name: Build
        run: |
          set -euo pipefail
          build_head=$(git rev-parse HEAD)
          npm run build
          test "$(git rev-parse HEAD)" = "$build_head"
          test -z "$(git status --porcelain -- src scripts package.json)"
          printf '%s\n' "$build_head" > .next/kp-head

      # The compiler may succeed while a lazy preload manifest names an absent chunk.
      # Read the actual artifact before any deployment, including the question route.
      - name: Production first-load delivery
        run: npm run qa:first-load -- --read --routes 'index,markets,positions,help,live,results,watchlist,markets/[id],account,updown/history'

      - name: Browser gates (local in-memory server)
        env:
          BASE: http://127.0.0.1:3009
          DISABLE_ADMIN_TOTP: "true"
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 3009 > /tmp/50pick-ci-browser-server.log 2>&1 &
          browser_server_pid=$!
          trap 'kill "$browser_server_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          let ready = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              const response = await fetch(`${process.env.BASE}/api/health`);
              const body = await response.json();
              if (response.ok && body.ok && body.database?.configured === false) { ready = true; break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          if (!ready) throw new Error("Isolated browser server did not become ready without a database");
          JS
          npm run test:responsive
          npm run test:motion
          npm run test:revoked-deadend
          npm run test:admin-section-gate
          npm run test:needle-rest

      - name: Upload browser server diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-server-log
          path: /tmp/50pick-ci-browser-server.log
          if-no-files-found: ignore

      # ── The real-Postgres proofs — what a single process cannot show ─────────
      - name: Migrate CI Postgres
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.CI_DB_URL }}

      - name: Certify the CI DB as a disposable load-test target
        run: node scripts/load/ci-plant-marker.mjs
        env:
          DATABASE_URL: ${{ env.CI_DB_URL }}

      - name: C4 — cross-instance wallet double-spend proof (s10)
        run: npx tsx scripts/load/s10-cross-instance.mts
        env:
          DATABASE_URL: ${{ env.CI_DB_URL }}

      - name: C6 — cross-instance audit-chain fork proof (s11)
        run: npx tsx scripts/load/s11-audit-cross-instance.mts
        env:
          DATABASE_URL: ${{ env.CI_DB_URL }}

      # Same class as s10/s11: cannot be proven in one process, because leader.ts keeps
      # its instance id in module scope and two calls inside one Node process always
      # agree. Two REAL OS processes race for the lifecycle lease; exactly one may win.
      # Removing the advisory lock from the election makes both win — verified.
      - name: Cross-instance leader election proof (s12)
        run: npx tsx scripts/load/s12-leader-contention.mts
        env:
          DATABASE_URL: ${{ env.CI_DB_URL }}
